{{- if .Values.secretProviderClass.enabled -}}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.secretProviderClass.name }}
spec:
  provider: aws
  parameters:
    objects: |
        - objectName: "pagopa-{{ .Values.secretProviderClass.env }}-atm-layer/reporting/credentials"
          objectType: "secretsmanager"
          jmesPath: 
              - path: PAGOPA_API_SUBSCRIPTION_KEY
                objectAlias: PAGOPA_API_SUBSCRIPTION_KEY
  secretObjects:
    - secretName: {{ .Values.reportingService.credentialsSecretName }}
      type: Opaque
      data: 
        - objectName: "PAGOPA_API_SUBSCRIPTION_KEY"  # reference the corresponding parameter
          key: {{ .Values.reportingService.credentialsSecretKeys.api_key }}
{{- end }}
